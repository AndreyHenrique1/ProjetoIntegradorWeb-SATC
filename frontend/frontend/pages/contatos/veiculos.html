<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Veículos · Alfa Comunicação e Conteúdo</title>
  <link rel="icon" href="../../assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
</head>
<body data-raiz="../../" data-ativo="veiculos">
  <header class="topbar" id="topbar"></header>

  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="content">
      <div class="page-head">
        <h1>Veículos</h1>
        <button class="btn" id="btnNovo" type="button">Novo veículo</button>
      </div>

      <div class="toolbar">
        <div class="busca">
          <label for="busca" class="sr">Buscar veículo</label>
          <input type="search" id="busca" placeholder="Buscar por nome, tipo ou abrangência">
        </div>
        <label for="filtroTipo" class="sr">Tipo de veículo</label>
        <select id="filtroTipo"><option value="">Todos os tipos</option></select>
        <label for="filtroStatus" class="sr">Status</label>
        <select id="filtroStatus">
          <option value="todos">Todos os status</option>
          <option value="ativos">Somente ativos</option>
          <option value="inativos">Somente inativos</option>
        </select>
        <span class="total" id="total" aria-live="polite"></span>
      </div>

      <section class="card" aria-label="Lista de veículos">
        <div class="tabela-wrap">
          <table class="tabela">
            <thead>
              <tr><th>Veículo</th><th>Tipo</th><th>Abrangência</th><th>Telefone da redação</th><th>Status</th><th><span class="sr">Ações</span></th></tr>
            </thead>
            <tbody id="corpo"></tbody>
          </table>
        </div>
        <div class="estado" id="estado">Carregando veículos…</div>
      </section>
    </main>
  </div>
  <div class="scrim" id="scrim" hidden></div>

  <!-- Criar / editar -->
  <dialog class="modal" id="modal" aria-labelledby="modalTitulo">
    <form id="form" novalidate>
      <h2 id="modalTitulo">Novo veículo</h2>
      <p class="sub">Campos com * são obrigatórios.</p>
      <p class="erro-form" id="erroForm" role="alert" hidden></p>

      <div class="grid-form">
        <div class="field full">
          <label for="nome">Nome do veículo *</label>
          <input id="nome" name="nome" autocomplete="off" required>
        </div>
        <div class="field">
          <label for="tipo">Tipo *</label>
          <select id="tipo" name="tipo" required></select>
        </div>
        <div class="field">
          <label for="abrangencia">Abrangência *</label>
          <input id="abrangencia" name="abrangencia" list="sugestoesAbrangencia" autocomplete="off" placeholder="Local, Regional, Nacional…" required>
          <datalist id="sugestoesAbrangencia">
            <option value="Local"></option><option value="Regional"></option><option value="Estadual"></option>
            <option value="Nacional"></option><option value="Internacional"></option>
          </datalist>
        </div>
        <div class="field full">
          <label for="tel">Telefone da redação *</label>
          <input id="tel" name="tel" type="tel" inputmode="tel" placeholder="(00) 0000-0000" required>
        </div>
        <label class="check full"><input type="checkbox" id="ativo" checked> Veículo ativo</label>
      </div>

      <div class="modal-acoes">
        <button type="button" class="btn sec" id="btnCancelar">Cancelar</button>
        <button type="submit" class="btn" id="btnSalvar">Salvar</button>
      </div>
    </form>
  </dialog>

  <!-- Excluir -->
  <dialog class="modal" id="modalExcluir" aria-labelledby="excluirTitulo">
    <form method="dialog" id="formExcluir" style="padding:28px">
      <h2 id="excluirTitulo">Excluir veículo?</h2>
      <p class="sub" id="excluirTexto"></p>
      <p class="erro-form" id="erroExcluir" role="alert" hidden></p>
      <div class="modal-acoes">
        <button type="button" class="btn sec" id="btnExcluirCancelar">Cancelar</button>
        <button type="submit" class="btn perigo" id="btnExcluirOk">Excluir</button>
      </div>
    </form>
  </dialog>

  <script src="../../js/config.js"></script>
  <script src="../../js/utils/formatters.js"></script>
  <script src="../../js/utils/masks.js"></script>
  <script src="../../js/utils/ui.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/api/http.js"></script>
  <script src="../../js/api/veiculoApi.js"></script>
  <script src="../../js/api/tipoVeiculoApi.js"></script>
  <script src="../../js/layout.js"></script>
  <script src="../../js/pages/veiculos.js"></script>
</body>
</html>
