<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cargos · Alfa Comunicação e Conteúdo</title>
  <link rel="icon" href="../../assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
</head>
<body data-raiz="../../" data-ativo="cargos">
  <header class="topbar" id="topbar"></header>

  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="content">
      <div class="page-head">
        <h1>Cargos</h1>
        <button class="btn" id="btnNovo" type="button">Novo cargo</button>
      </div>

      <div class="toolbar">
        <div class="busca">
          <label for="busca" class="sr">Buscar cargo</label>
          <input type="search" id="busca" placeholder="Buscar por nome do cargo">
        </div>
        <label for="filtroStatus" class="sr">Status</label>
        <select id="filtroStatus">
          <option value="todos">Todos os status</option>
          <option value="ativos">Somente ativos</option>
          <option value="inativos">Somente inativos</option>
        </select>
        <span class="total" id="total" aria-live="polite"></span>
      </div>

      <section class="card" aria-label="Lista de cargos">
        <div class="tabela-wrap">
          <table class="tabela">
            <thead>
              <tr><th>Cargo</th><th>Integrantes ativos</th><th>Status</th><th><span class="sr">Ações</span></th></tr>
            </thead>
            <tbody id="corpo"></tbody>
          </table>
        </div>
        <div class="estado" id="estado">Carregando cargos…</div>
      </section>
    </main>
  </div>
  <div class="scrim" id="scrim" hidden></div>

  <!-- Criar / editar -->
  <dialog class="modal" id="modal" aria-labelledby="modalTitulo">
    <form id="form" novalidate>
      <h2 id="modalTitulo">Novo cargo</h2>
      <p class="sub">Campos com * são obrigatórios.</p>
      <p class="erro-form" id="erroForm" role="alert" hidden></p>

      <div class="grid-form">
        <div class="field full">
          <label for="nome">Nome do cargo *</label>
          <input id="nome" name="nome" autocomplete="off" placeholder="Ex.: Assessor de imprensa" required>
        </div>
        <label class="check full"><input type="checkbox" id="ativo" checked> Cargo ativo</label>
      </div>

      <div class="modal-acoes">
        <button type="button" class="btn sec" id="btnCancelar">Cancelar</button>
        <button type="submit" class="btn" id="btnSalvar">Salvar</button>
      </div>
    </form>
  </dialog>

  <!-- Excluir -->
  <dialog class="modal" id="modalExcluir" aria-labelledby="excluirTitulo">
    <form method="dialog" id="formExcluir" style="padding:28px">
      <h2 id="excluirTitulo">Excluir cargo?</h2>
      <p class="sub" id="excluirTexto"></p>
      <p class="erro-form" id="erroExcluir" role="alert" hidden></p>
      <div class="modal-acoes">
        <button type="button" class="btn sec" id="btnExcluirCancelar">Cancelar</button>
        <button type="submit" class="btn perigo" id="btnExcluirOk">Excluir</button>
      </div>
    </form>
  </dialog>

  <script src="../../js/config.js"></script>
  <script src="../../js/utils/formatters.js"></script>
  <script src="../../js/utils/ui.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/api/http.js"></script>
  <script src="../../js/api/cargoApi.js"></script>
  <script src="../../js/layout.js"></script>
  <script src="../../js/pages/cargos.js"></script>
</body>
</html>
