<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Equipes · Alfa Comunicação e Conteúdo</title>
  <link rel="icon" href="../../assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
</head>
<body data-raiz="../../" data-ativo="equipes">
  <header class="topbar" id="topbar"></header>

  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="content">
      <div class="page-head">
        <h1>Equipes</h1>
        <button class="btn" id="btnNovo" type="button">Novo integrante</button>
      </div>

      <div class="toolbar">
        <div class="busca">
          <label for="busca" class="sr">Buscar integrante</label>
          <input type="search" id="busca" placeholder="Buscar por nome, e-mail ou cargo">
        </div>
        <label for="filtroCargo" class="sr">Cargo</label>
        <select id="filtroCargo"><option value="">Todos os cargos</option></select>
        <label for="filtroStatus" class="sr">Status</label>
        <select id="filtroStatus">
          <option value="todos">Todos os status</option>
          <option value="ativos">Somente ativos</option>
          <option value="inativos">Somente inativos</option>
        </select>
        <span class="total" id="total" aria-live="polite"></span>
      </div>

      <section class="card" aria-label="Lista de integrantes">
        <div class="tabela-wrap">
          <table class="tabela">
            <thead>
              <tr><th>Integrante</th><th>Cargo</th><th>Telefone</th><th>Cadastro</th><th>Status</th><th><span class="sr">Ações</span></th></tr>
            </thead>
            <tbody id="corpo"></tbody>
          </table>
        </div>
        <div class="estado" id="estado">Carregando equipe…</div>
      </section>
    </main>
  </div>
  <div class="scrim" id="scrim" hidden></div>

  <!-- Criar / editar -->
  <dialog class="modal" id="modal" aria-labelledby="modalTitulo">
    <form id="form" novalidate>
      <h2 id="modalTitulo">Novo integrante</h2>
      <p class="sub">Campos com * são obrigatórios.</p>
      <p class="erro-form" id="erroForm" role="alert" hidden></p>

      <div class="grid-form">
        <div class="field full">
          <label for="nome">Nome *</label>
          <input id="nome" name="nome" autocomplete="off" required>
        </div>
        <div class="field">
          <label for="cargo">Cargo *</label>
          <select id="cargo" name="cargo" required></select>
        </div>
        <div class="field">
          <label for="tel">Telefone *</label>
          <input id="tel" name="tel" type="tel" inputmode="tel" placeholder="(00) 00000-0000" required>
        </div>
        <div class="field full">
          <label for="email">E-mail *</label>
          <input id="email" name="email" type="email" autocomplete="off" placeholder="nome@alfa.com.br" required>
        </div>
        <div class="field full">
          <label for="senha" id="rotuloSenha">Senha *</label>
          <input id="senha" name="senha" type="password" autocomplete="new-password" placeholder="Mínimo de 6 caracteres">
          <small class="dica-campo" id="dicaSenha"></small>
        </div>
        <label class="check full"><input type="checkbox" id="ativo" checked> Integrante ativo</label>
      </div>

      <div class="modal-acoes">
        <button type="button" class="btn sec" id="btnCancelar">Cancelar</button>
        <button type="submit" class="btn" id="btnSalvar">Salvar</button>
      </div>
    </form>
  </dialog>

  <!-- Excluir -->
  <dialog class="modal" id="modalExcluir" aria-labelledby="excluirTitulo">
    <form method="dialog" id="formExcluir" style="padding:28px">
      <h2 id="excluirTitulo">Excluir integrante?</h2>
      <p class="sub" id="excluirTexto"></p>
      <p class="erro-form" id="erroExcluir" role="alert" hidden></p>
      <div class="modal-acoes">
        <button type="button" class="btn sec" id="btnExcluirCancelar">Cancelar</button>
        <button type="submit" class="btn perigo" id="btnExcluirOk">Excluir</button>
      </div>
    </form>
  </dialog>

  <script src="../../js/config.js"></script>
  <script src="../../js/utils/formatters.js"></script>
  <script src="../../js/utils/masks.js"></script>
  <script src="../../js/utils/ui.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/api/http.js"></script>
  <script src="../../js/api/equipeApi.js"></script>
  <script src="../../js/api/cargoApi.js"></script>
  <script src="../../js/layout.js"></script>
  <script src="../../js/pages/equipes.js"></script>
</body>
</html>
